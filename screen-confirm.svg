<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" width="680" height="262" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .dot { animation: flow 3.6s linear infinite; }
    .d2 { animation-delay: -1.2s; }
    .d3 { animation-delay: -2.4s; }
    @keyframes flow {
      0%   { transform: translateX(0);     opacity: 0; }
      6%   { opacity: 1; }
      94%  { opacity: 1; }
      100% { transform: translateX(560px); opacity: 0; }
    }
    .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .hover1 { animation: hover 2.2s ease-in-out infinite alternate; }
    .hover2 { animation: hover 2.2s ease-in-out infinite alternate; animation-delay: -1.1s; }
    @keyframes hover { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    .flag { animation: flag 2.4s ease-in-out infinite; }
    .f2 { animation-delay: -.8s; } .f3 { animation-delay: -1.6s; }
    @keyframes flag { 0%,100% { fill: #dfe7ef; } 45%,60% { fill: #f2994a; } }
    .wave { stroke-dasharray: 260; animation: draw 2.4s linear infinite; }
    @keyframes draw { from { stroke-dashoffset: 260; } to { stroke-dashoffset: 0; } }
    .label { font-size: 13px; font-weight: 600; fill: #1f2d3d; }
    .sub { font-size: 11px; fill: #5b6b7a; }
    .tier { font-size: 10px; font-weight: 700; letter-spacing: .08em; }
  </style>

  <rect width="680" height="262" rx="18" fill="#f6f9fc"/>
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Screen, then confirm · concrete inspection</text>

  <text class="tier" x="170" y="58" text-anchor="middle" fill="#1d4ed8">TIER 1 · SCREEN</text>
  <text class="tier" x="490" y="58" text-anchor="middle" fill="#0f766e">TIER 2 · CONFIRM</text>

  <line x1="100" y1="116" x2="580" y2="116" stroke="#c7d3df" stroke-width="3" stroke-dasharray="6 6"/>
  <g>
    <circle class="dot"    cx="60" cy="116" r="5" fill="#f2994a"/>
    <circle class="dot d2" cx="60" cy="116" r="5" fill="#f2994a"/>
    <circle class="dot d3" cx="60" cy="116" r="5" fill="#f2994a"/>
  </g>

  <!-- 1: scouts -->
  <g transform="translate(40,76)">
    <rect width="100" height="80" rx="12" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
    <g class="hover1">
      <line x1="16" y1="28" x2="44" y2="28" stroke="#2b3a4a" stroke-width="2"/>
      <rect x="25" y="25" width="10" height="7" rx="2" fill="#2b3a4a"/>
      <ellipse cx="16" cy="24" rx="7" ry="2" fill="#5b6b7a" class="pulse"/>
      <ellipse cx="44" cy="24" rx="7" ry="2" fill="#5b6b7a" class="pulse"/>
      <polygon points="26,34 34,34 39,48 21,48" fill="#93c5fd" opacity="0.6"/>
    </g>
    <g class="hover2">
      <line x1="56" y1="40" x2="84" y2="40" stroke="#2b3a4a" stroke-width="2"/>
      <rect x="65" y="37" width="10" height="7" rx="2" fill="#2b3a4a"/>
      <ellipse cx="56" cy="36" rx="7" ry="2" fill="#5b6b7a" class="pulse"/>
      <ellipse cx="84" cy="36" rx="7" ry="2" fill="#5b6b7a" class="pulse"/>
      <polygon points="66,46 74,46 79,60 61,60" fill="#93c5fd" opacity="0.6"/>
    </g>
  </g>
  <text class="label" x="90" y="178" text-anchor="middle">Scout</text>
  <text class="sub" x="90" y="194" text-anchor="middle">nano-drones · 0.14 M params</text>

  <!-- 2: flag zones -->
  <g transform="translate(200,76)">
    <rect width="100" height="80" rx="12" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
    <g transform="translate(14,14)">
      <rect x="0"  y="0"  width="15" height="15" rx="2" fill="#dfe7ef"/>
      <rect x="18" y="0"  width="15" height="15" rx="2" class="flag" fill="#dfe7ef"/>
      <rect x="36" y="0"  width="15" height="15" rx="2" fill="#dfe7ef"/>
      <rect x="54" y="0"  width="15" height="15" rx="2" fill="#dfe7ef"/>
      <rect x="0"  y="18" width="15" height="15" rx="2" fill="#dfe7ef"/>
      <rect x="18" y="18" width="15" height="15" rx="2" fill="#dfe7ef"/>
      <rect x="36" y="18" width="15" height="15" rx="2" class="flag f2" fill="#dfe7ef"/>
      <rect x="54" y="18" width="15" height="15" rx="2" fill="#dfe7ef"/>
      <rect x="0"  y="36" width="15" height="15" rx="2" class="flag f3" fill="#dfe7ef"/>
      <rect x="18" y="36" width="15" height="15" rx="2" fill="#dfe7ef"/>
      <rect x="36" y="36" width="15" height="15" rx="2" fill="#dfe7ef"/>
      <rect x="54" y="36" width="15" height="15" rx="2" fill="#dfe7ef"/>
    </g>
  </g>
  <text class="label" x="250" y="178" text-anchor="middle">Flag</text>
  <text class="sub" x="250" y="194" text-anchor="middle">only zones worth a contact</text>

  <!-- 3: ultrasonic A-scan -->
  <g transform="translate(360,76)">
    <rect width="100" height="80" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/>
    <rect x="12" y="14" width="76" height="52" rx="4" fill="#f0fdfa"/>
    <path class="wave" d="M14 40 L24 40 L27 22 L30 58 L33 30 L36 46 L40 40 L54 40 L56 33 L58 47 L60 40 L72 40 L74 26 L77 54 L80 36 L83 40 L88 40" stroke="#0f766e" stroke-width="2" fill="none" stroke-linejoin="round"/>
  </g>
  <text class="label" x="410" y="178" text-anchor="middle">Confirm</text>
  <text class="sub" x="410" y="194" text-anchor="middle">1 A-scan · AUROC 0.96 to 0.99</text>

  <!-- 4: hidden-defect map -->
  <g transform="translate(520,76)">
    <rect width="100" height="80" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/>
    <rect x="16" y="16" width="56" height="48" rx="4" fill="#e2e8f0"/>
    <circle cx="36" cy="34" r="6" fill="#0f766e" opacity="0.85"/>
    <circle cx="56" cy="50" r="4" fill="#0f766e" opacity="0.6"/>
    <circle class="pulse" cx="74" cy="60" r="12" fill="#27ae60"/>
    <path d="M68 60 L73 65 L81 55" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="label" x="570" y="178" text-anchor="middle">Fuse</text>
  <text class="sub" x="570" y="194" text-anchor="middle">hidden-defect map</text>

  <rect x="95" y="214" width="490" height="30" rx="15" fill="#0f1b2d"/>
  <text x="340" y="234" text-anchor="middle" font-size="12.5" fill="#e2e8f0">Finds <tspan font-weight="700" fill="#fbbf24">72%</tspan> of what testing every zone finds, with <tspan font-weight="700" fill="#fbbf24">27%</tspan> of the contacts (simulated)</text>
</svg>
