<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="680" height="230" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .dot { animation: flow 3.2s linear infinite; }
    .d2 { animation-delay: -1.07s; }
    .d3 { animation-delay: -2.13s; }
    @keyframes flow {
      0%   { transform: translateX(0);     opacity: 0; }
      6%   { opacity: 1; }
      94%  { opacity: 1; }
      100% { transform: translateX(560px); opacity: 0; }
    }
    .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .scan { animation: scan 2.4s ease-in-out infinite alternate; }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(44px); } }
    .layer { animation: glow 1.8s ease-in-out infinite; }
    .l2 { animation-delay: .3s; } .l3 { animation-delay: .6s; } .l4 { animation-delay: .9s; }
    @keyframes glow { 0%,100% { fill: #c7dcf0; } 50% { fill: #3f88c5; } }
    .label { font-size: 13px; font-weight: 600; fill: #1f2d3d; }
    .sub { font-size: 11px; fill: #5b6b7a; }
  </style>

  <rect width="680" height="230" rx="18" fill="#f6f9fc"/>
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Automated damage detection · UAV inspection</text>

  <!-- connector line -->
  <line x1="100" y1="110" x2="580" y2="110" stroke="#c7d3df" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- flowing data -->
  <g>
    <circle class="dot"    cx="60" cy="110" r="5" fill="#f2994a"/>
    <circle class="dot d2" cx="60" cy="110" r="5" fill="#f2994a"/>
    <circle class="dot d3" cx="60" cy="110" r="5" fill="#f2994a"/>
  </g>

  <!-- 1: UAV capture -->
  <g transform="translate(40,70)">
    <rect width="100" height="80" rx="12" fill="#fff" stroke="#2b3a4a" stroke-width="2"/>
    <!-- drone -->
    <line x1="30" y1="32" x2="70" y2="32" stroke="#2b3a4a" stroke-width="2.5"/>
    <rect x="42" y="28" width="16" height="10" rx="3" fill="#2b3a4a"/>
    <ellipse cx="28" cy="26" rx="10" ry="2.5" fill="#5b6b7a" class="pulse"/>
    <ellipse cx="72" cy="26" rx="10" ry="2.5" fill="#5b6b7a" class="pulse"/>
    <polygon points="44,40 56,40 64,62 36,62" fill="#f2c94c" opacity="0.45"/>
  </g>
  <text class="label" x="90" y="172" text-anchor="middle">Capture</text>
  <text class="sub" x="90" y="188" text-anchor="middle">UAV grid survey</text>

  <!-- 2: CNN encoder -->
  <g transform="translate(200,70)">
    <rect width="100" height="80" rx="12" fill="#fff" stroke="#2b3a4a" stroke-width="2"/>
    <rect class="layer" fill="#c7dcf0" x="16" y="14" width="12" height="52" rx="3"/>
    <rect class="layer l2" fill="#c7dcf0" x="34" y="20" width="12" height="40" rx="3"/>
    <rect class="layer l3" fill="#c7dcf0" x="52" y="26" width="12" height="28" rx="3"/>
    <rect class="layer l4" fill="#c7dcf0" x="70" y="32" width="12" height="16" rx="3"/>
  </g>
  <text class="label" x="250" y="172" text-anchor="middle">Classify</text>
  <text class="sub" x="250" y="188" text-anchor="middle">ResNet50 · 4 classes</text>

  <!-- 3: segmentation -->
  <g transform="translate(360,70)">
    <rect width="100" height="80" rx="12" fill="#fff" stroke="#2b3a4a" stroke-width="2"/>
    <rect x="14" y="14" width="72" height="52" rx="4" fill="#dfe7ef"/>
    <path d="M22 22 L38 34 L34 44 L52 52 L60 62" stroke="#eb5757" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect class="scan" x="14" y="14" width="72" height="8" fill="#3f88c5" opacity="0.35"/>
  </g>
  <text class="label" x="410" y="172" text-anchor="middle">Segment</text>
  <text class="sub" x="410" y="188" text-anchor="middle">DeepLabV3+</text>

  <!-- 4: report -->
  <g transform="translate(520,70)">
    <rect width="100" height="80" rx="12" fill="#fff" stroke="#2b3a4a" stroke-width="2"/>
    <rect x="22" y="14" width="40" height="52" rx="4" fill="#fff" stroke="#5b6b7a" stroke-width="2"/>
    <line x1="30" y1="26" x2="54" y2="26" stroke="#c7d3df" stroke-width="3"/>
    <line x1="30" y1="36" x2="54" y2="36" stroke="#c7d3df" stroke-width="3"/>
    <line x1="30" y1="46" x2="46" y2="46" stroke="#c7d3df" stroke-width="3"/>
    <circle class="pulse" cx="68" cy="56" r="12" fill="#27ae60"/>
    <path d="M62 56 L67 61 L75 51" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="label" x="570" y="172" text-anchor="middle">Report</text>
  <text class="sub" x="570" y="188" text-anchor="middle">Zone detection</text>
</svg>
